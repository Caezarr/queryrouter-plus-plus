# QueryRouter++ with LibreChat (4 modes).
#
# Usage:
#   cp .env.example .env   # set provider API keys and MONGO_ROOT_PASSWORD
#   docker compose -f docker-compose.4modes.yml up -d
#   docker compose -f docker-compose.4modes.yml --profile with-librechat up -d
#
# config/presets.yaml and data_models/ are mounted read-only, so editing them
# only needs a container restart.

services:
  # QueryRouter++ API
  queryrouter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queryrouter-4modes
    ports:
      - "${QUERYROUTER_PORT:-8000}:8000"
    environment:
      # Provider API keys (at least one is required for /v1/chat/completions)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
    volumes:
      # Mount presets configuration
      - ./config/presets.yaml:/app/config/presets.yaml:ro
      # Mount data models
      - ./data_models:/app/data_models:ro
    # Health check is inherited from the Dockerfile (python-slim has no curl).
    networks:
      - queryrouter-network
    restart: unless-stopped

  # MongoDB for LibreChat
  mongodb:
    image: mongo:6
    container_name: queryrouter-mongodb
    ports:
      - "127.0.0.1:27017:27017"  # local only
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
    networks:
      - queryrouter-network
    restart: unless-stopped

  # LibreChat (optional: start it with --profile with-librechat, or point your
  # own LibreChat at http://<host>:8000/v1)
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: queryrouter-librechat
    ports:
      - "${LIBRECHAT_PORT:-3080}:3080"
    depends_on:
      - mongodb
      - queryrouter
    environment:
      # LibreChat MongoDB config
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/LibreChat?authSource=admin
      # QueryRouter++ endpoint config
      - QUERYROUTER_BASE_URL=http://queryrouter:8000
      - QUERYROUTER_API_KEY=${QUERYROUTER_API_KEY:-sk-queryrouter-local}
      # LibreChat settings
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3080
    volumes:
      # Mount LibreChat config with 4-modes preset
      - ./config/librechat-4modes.yaml:/app/librechat.yaml:ro
    networks:
      - queryrouter-network
    restart: unless-stopped
    profiles:
      - "with-librechat"  # Only start if explicitly requested

volumes:
  mongodb_data:
    driver: local

networks:
  queryrouter-network:
    driver: bridge
