name: Bug report
description: Report a bug in QueryRouter++
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or request payload
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - routing
        - scoring
        - data-models
        - api
        - ci
        - other
    validations:
      required: true
